<!DOCTYPE html>
<!-- © 2026 Wano Studio | المطور: مروان (Wano) | المالك الحصري: wanomrwan16@gmail.com -->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wano Studio — لوحة التحكم الذكية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<!-- استيراد الأيقونات الاحترافية - تتوافق وتنعكس تلقائياً مع الثيمات -->
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
<!-- مكتبة جوجل الرسمية لتسجيل الدخول الفعلي بـ OAuth2 -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
:root {
  --bg: #000000;
  --card: #0a0a0c;
  --border: rgba(255, 255, 255, 0.1);
  --tp: #ffffff;
  --tm: rgba(255, 255, 255, 0.6);
  --nc: #ffffff; /* أبيض ناصع في الوضع المظلم */
  --accent: #00ff88; /* لون برمجيات متناسق */
  --term-bg: #050608;
}

body.light-theme {
  --bg: #ffffff;
  --card: #f5f7fa;
  --border: rgba(0, 0, 0, 0.1);
  --tp: #000000;
  --tm: rgba(0, 0, 0, 0.6);
  --nc: #000000; /* يتحول لأسود ملكي في الوضع الفاتح */
  --term-bg: #f9fafb;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--tp); transition: background 0.3s, color 0.3s; overflow-x: hidden; }

/* الكانفاس */
#neon-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

/* التيرمنال المطور والبطيء */
#loader { position: fixed; inset: 0; background: #020204; z-index: 99999; display: flex; align-items: center; justify-content: center; transition: opacity 0.6s ease; }
#loader.hide { opacity: 0; pointer-events: none; }
.term-win { width: min(760px, 95vw); background: var(--term-bg); border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
.term-hd { background: rgba(0,0,0,0.3); padding: 12px 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
.tdot { width: 12px; height: 12px; border-radius: 50%; }
.tdot.r { background: #ff5f56; } .tdot.y { background: #ffbd2e; } .tdot.g { background: #27c93f; }
.term-title { flex: 1; text-align: center; font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--tm); }
.term-body { padding: 20px; height: 320px; overflow-y: auto; font-family: 'Share Tech Mono', monospace; font-size: 13px; line-height: 1.6; display: flex; flex-direction: column; gap: 4px; color: var(--tp); }
.t-cmd { color: var(--accent); }
.t-pkg { color: #569cd6; }
.t-success { color: #4ec9b0; }

/* شريط التنقل */
#nav { position: fixed; top: 0; inset-inline: 0; height: 75px; background: rgba(var(--bg), 0.75); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; z-index: 1000; }
.nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--tp); font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 1px; }

/* السطر أدناه (السطر 54) هو مكان الشعار المطلوب */
.nav-logo img { width: 34px; height: 34px; object-fit: contain; }

.nav-right { display: flex; align-items: center; gap: 20px; }
.owner-btn { background: var(--tp); color: var(--bg); border: none; padding: 8px 18px; font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; display: none; transition: opacity 0.2s; }
.owner-btn:hover { opacity: 0.9; }

/* لوحة الإعدادات */
#settings-panel { position: fixed; top: 85px; left: -300px; width: 280px; background: var(--card); border: 1px solid var(--border); border-left: none; padding: 20px; z-index: 1010; transition: left 0.3s cubic-bezier(0.1, 0.9, 0.2, 1); }
#settings-panel.open { left: 0; }
.set-toggle { position: absolute; right: -46px; top: -1px; width: 46px; height: 46px; background: var(--card); border: 1px solid var(--border); border-left: none; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--tp); font-size: 18px; }
.set-title { font-size: 14px; font-weight: 700; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.theme-btn { width: 100%; padding: 10px; background: transparent; border: 1px solid var(--border); color: var(--tp); cursor: pointer; font-family: 'Cairo', sans-serif; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
.theme-btn:hover { background: rgba(255,255,255,0.05); }

/* واجهة العرض الرئيسية */
#hero { min-height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 120px 20px 60px; position: relative; z-index: 1; }

/* سطر البروفايل الشخصي */
.hero-avatar { width: 90px; height: 90px; border-radius: 50%; border: 2px solid var(--border); overflow: hidden; margin-bottom: 20px; }
.hero-avatar img { width: 100%; height: 100%; object-fit: cover; }

.hero-title { font-size: clamp(32px, 6vw, 64px); font-weight: 900; letter-spacing: -1px; margin-bottom: 10px; }
.hero-desc { color: var(--tm); max-width: 600px; font-size: 15px; line-height: 1.6; font-weight: 300; }

/* قسم المشاريع المطور */
#projects { padding: 60px 40px; max-width: 1400px; margin: 0 auto; position: relative; z-index: 1; }
.sec-head { font-size: 24px; font-weight: 700; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
.proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }

/* بطاقة المشروع الاحترافية */
.p-card { background: var(--card); border: 1px solid var(--border); padding: 24px; position: relative; display: flex; flex-direction: column; gap: 12px; }
.p-top { display: flex; justify-content: space-between; align-items: flex-start; }
.p-title { font-size: 18px; font-weight: 700; color: var(--tp); }
.p-status { font-size: 11px; padding: 2px 8px; font-weight: 600; }
.p-status.available { background: rgba(0,255,136,0.1); color: #00ff88; }
.p-status.unavailable { background: rgba(255,95,86,0.1); color: #ff5f56; }
.p-desc { font-size: 13px; color: var(--tm); line-height: 1.6; min-height: 48px; }
.p-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 14px; }

/* أزرار التحميل */
.dl-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--bg); background: var(--tp); padding: 8px 16px; text-decoration: none; transition: opacity 0.2s; }
.dl-btn:hover { opacity: 0.9; }

/* القائمة المنبثقة للمالك (الثلاث شخوط) */
.opt-menu { position: relative; }
.opt-trigger { background: transparent; border: none; color: var(--tp); font-size: 20px; cursor: pointer; padding: 4px; display: none; }
.opt-dropdown { position: absolute; left: 0; top: 100%; background: var(--card); border: 1px solid var(--border); width: 120px; display: none; flex-direction: column; z-index: 10; }
.opt-dropdown.show { display: flex; }
.opt-item { background: transparent; border: none; color: var(--tp); padding: 8px 12px; font-size: 12px; text-align: right; cursor: pointer; font-family: 'Cairo', sans-serif; }
.opt-item:hover { background: rgba(255,255,255,0.05); }

/* النافذة المنبثقة للمشروع (Modal) */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 2000; display: none; align-items: center; justify-content: center; }
.modal.open { display: flex; }
.modal-content { background: var(--card); border: 1px solid var(--border); width: min(500px, 90vw); padding: 30px; display: flex; flex-direction: column; gap: 16px; }
.modal-title { font-size: 18px; font-weight: 700; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group label { font-size: 12px; color: var(--tm); }
.form-group input, .form-group textarea, .form-group select { background: rgba(0,0,0,0.2); border: 1px solid var(--border); padding: 10px; color: var(--tp); font-family: 'Cairo', sans-serif; font-size: 13px; }
.form-group input:focus, .form-group textarea:focus { border-color: var(--tp); outline: none; }
.modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
.m-btn { padding: 10px 20px; font-family: 'Cairo', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
.m-btn.cancel { background: transparent; border: 1px solid var(--border); color: var(--tp); }
.m-btn.publish { background: var(--tp); color: var(--bg); }

@media(max-width: 768px) {
  #nav { padding: 0 20px; }
  #projects { padding: 40px 20px; }
}
</style>
</head>
<body class="dark-theme">

  <canvas id="neon-canvas"></canvas>

  <!-- التيرمنال العبقري السلس -->
  <div id="loader">
    <div class="term-win">
      <div class="term-hd">
        <div class="tdot r"></div><div class="tdot y"></div><div class="tdot g"></div>
        <div class="term-title">wano@terminal:~ - Node System Initializer</div>
      </div>
      <div class="term-body" id="term-logs"></div>
    </div>
  </div>

  <!-- شريط التنقل العلوي -->
  <nav id="nav">
    <a href="#" class="nav-logo">
      <!-- الشعار تم تحديث اسمه المباشر هنا بدقة -->
      <img src="37354_2.png" alt="Wano Logo">
      <span>WANO STUDIO</span>
    </a>
    <div class="nav-right">
      <button class="owner-btn" id="add-proj-btn" onclick="openModal()"><i class="ri-add-line"></i> إضافة مشروع</button>
      <div id="g-signin-btn"></div>
      <div id="user-profile-area"></div>
    </div>
  </nav>

  <!-- لوحة الإعدادات الجانبية -->
  <div id="settings-panel">
    <div class="set-toggle" onclick="document.getElementById('settings-panel').classList.toggle('open')">
      <i class="ri-settings-line"></i>
    </div>
    <div class="set-title">تخصيص النظام</div>
    <button class="theme-btn" onclick="toggleSystemTheme()" id="t-trigger">
      <i class="ri-sun-line"></i> الوضع الفاتح
    </button>
  </div>

  <!-- واجهة الهيرو -->
  <section id="hero">
    <div class="hero-avatar" id="avatar-container">
      <!-- الصورة الشخصية الافتراضية، وسيتم سحب صورتك الحقيقية برمجياً عبر الـ ID -->
      <img src="37354_2.png" alt="Wano" id="main-avatar">
    </div>
    <h1 class="hero-title">WANO STUDIO</h1>
    <p class="hero-desc">منصة برمجية متكاملة لرفع وتنزيل الأكواد والمشاريع الحية بشكل مباشر وسلس.</p>
  </section>

  <!-- قسم عرض المشاريع -->
  <section id="projects">
    <div class="sec-head"><i class="ri-code-block"></i> المشاريع البرمجية الحالية</div>
    <div class="proj-grid" id="projects-box">
      <!-- يتم حقن الكروت وتحديثها برمجياً هنا بالكامل -->
    </div>
  </section>

  <!-- نافذة إضافة وتعديل المشاريع (Modal) -->
  <div class="modal" id="project-modal">
    <div class="modal-content">
      <div class="modal-title" id="m-layout-title">إضافة مشروع جديد</div>
      <input type="hidden" id="edit-idx">
      
      <div class="form-group">
        <label>اسم المشروع</label>
        <input type="text" id="p-name-in" placeholder="مثال: Azkār Bot">
      </div>
      
      <div class="form-group">
        <label>حالة المشروع</label>
        <select id="p-status-in">
          <option value="available">متوفر</option>
          <option value="unavailable">غير متوفر</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>وصف للمشروع</label>
        <textarea id="p-desc-in" rows="3" placeholder="اكتب وصفاً مختصراً ودقيقاً هنا..."></textarea>
      </div>
      
      <div class="form-group">
        <label>ملف المشروع البرمجي (يتم رفعه من جهازك)</label>
        <input type="file" id="p-file-in">
      </div>
      
      <div class="modal-btns">
        <button class="m-btn cancel" onclick="closeModal()">إلغاء (Cancel)</button>
        <button class="m-btn publish" onclick="saveProject()">نشر (Publish)</button>
      </div>
    </div>
  </div>
<script>
// 1. إعدادات المالك (البيانات التي طلبتها)
const OWNER_EMAIL = "wanomrwan16@gmail.com";
const DISCORD_USER_ID = "1484004341743620279";
let currentUser = null;
let projects = JSON.parse(localStorage.getItem('wano_projects')) || [];

// 2. محرك التيرمنال الواقعي (الكتابة اليدوية والتحميل البطيء)
const termLogs = document.getElementById('term-logs');
const terminalScript = [
  { text: "Initializing Wano OS Kernel...", type: "cmd" },
  { text: "Loading core dependencies...", type: "cmd" },
  { text: "npm install @wano/neon-engine @wano/security", type: "pkg" },
  { text: "fetch: [####################] 100% (2.4s)", type: "info" },
  { text: "Linking OAuth2 Google services...", type: "cmd" },
  { text: "Checking permissions for wanomrwan16@gmail.com...", type: "info" },
  { text: "System optimized. Launching interface...", type: "success" }
];

async function runTerminal() {
  for (let line of terminalScript) {
    const div = document.createElement('div');
    div.className = line.type === 'cmd' ? 't-cmd' : (line.type === 'success' ? 't-success' : 't-pkg');
    termLogs.appendChild(div);
    
    // محاكاة الكتابة اليدوية
    for (let char of line.text) {
      div.innerHTML += char;
      await new Promise(r => setTimeout(r, Math.random() * 40 + 20));
    }
    await new Promise(r => setTimeout(r, 600)); // تأخير بين الأسطر ليكون واقعياً
    termLogs.scrollTop = termLogs.scrollHeight;
  }
  setTimeout(() => document.getElementById('loader').classList.add('hide'), 1000);
}

// 3. نظام Google OAuth2 وتسجيل الدخول
window.onload = function () {
  runTerminal();
  renderProjects();
  updateDiscordAvatar(); // تحديث الصورة من ديسكورد فور التحميل

  google.accounts.id.initialize({
    client_id: "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com", // ضع الـ ID الخاص بك هنا
    callback: handleCredentialResponse
  });
  google.accounts.id.renderButton(
    document.getElementById("g-signin-btn"),
    { theme: "outline", size: "medium", shape: "pill" }
  );
};

function handleCredentialResponse(response) {
  const payload = JSON.parse(atob(response.credential.split('.')[1]));
  currentUser = payload;
  
  // إخفاء زر تسجيل الدخول وإظهار البروفايل
  document.getElementById('g-signin-btn').style.display = 'none';
  document.getElementById('user-profile-area').innerHTML = `
    <div style="display:flex; align-items:center; gap:10px;">
       <span style="font-size:12px; font-weight:600;">${payload.name}</span>
       <img src="${payload.picture}" style="width:30px; height:30px; border-radius:50%; border:1px solid var(--border);">
    </div>
  `;

  // التحقق من صلاحيات المالك (أنت)
  if (payload.email === OWNER_EMAIL) {
    document.getElementById('add-proj-btn').style.display = 'block';
    document.querySelectorAll('.opt-trigger').forEach(el => el.style.display = 'block');
  }
}

// 4. تحديث صورة ديسكورد تلقائياً عبر API (بدون بوت)
async function updateDiscordAvatar() {
  try {
    // نستخدم Lanyard API أو أي API مفتوح لجلب بيانات المستخدم عبر الـ ID
    const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`);
    const data = await res.json();
    if (data.success && data.data.discord_user.avatar) {
      const avatarHash = data.data.discord_user.avatar;
      const avatarUrl = `https://cdn.discordapp.com/avatars/${DISCORD_USER_ID}/${avatarHash}.png?size=256`;
      document.getElementById('main-avatar').src = avatarUrl;
    }
  } catch (e) {
    console.log("فشل جلب صورة ديسكورد، سيتم استخدام الشعار الافتراضي.");
  }
}

// 5. وظائف إدارة المشاريع (إضافة، حفظ، حذف)
const modal = document.getElementById('project-modal');
function openModal(editIdx = null) {
  modal.classList.add('open');
  if (editIdx !== null) {
    document.getElementById('m-layout-title').innerText = "تعديل المشروع";
    document.getElementById('edit-idx').value = editIdx;
    const p = projects[editIdx];
    document.getElementById('p-name-in').value = p.name;
    document.getElementById('p-status-in').value = p.status;
    document.getElementById('p-desc-in').value = p.desc;
  } else {
    document.getElementById('m-layout-title').innerText = "إضافة مشروع جديد";
    document.getElementById('edit-idx').value = "";
    document.getElementById('p-name-in').value = "";
    document.getElementById('p-desc-in').value = "";
  }
}

function closeModal() { modal.classList.remove('open'); }

function saveProject() {
  const name = document.getElementById('p-name-in').value;
  const status = document.getElementById('p-status-in').value;
  const desc = document.getElementById('p-desc-in').value;
  const fileInput = document.getElementById('p-file-in');
  const editIdx = document.getElementById('edit-idx').value;

  if (!name || !desc) return alert("يرجى ملء الحقول الأساسية!");

  const newProj = {
    name, status, desc,
    fileName: fileInput.files[0] ? fileInput.files[0].name : (editIdx !== "" ? projects[editIdx].fileName : "No File"),
    date: new Date().toLocaleDateString()
  };

  if (editIdx !== "") {
    projects[editIdx] = newProj;
  } else {
    projects.push(newProj);
  }

  localStorage.setItem('wano_projects', JSON.stringify(projects));
  renderProjects();
  closeModal();
}

function deleteProject(idx) {
  if (confirm("هل أنت متأكد من حذف هذا المشروع نهائياً؟")) {
    projects.splice(idx, 1);
    localStorage.setItem('wano_projects', JSON.stringify(projects));
    renderProjects();
  }
}

function renderProjects() {
  const box = document.getElementById('projects-box');
  box.innerHTML = "";
  projects.forEach((p, i) => {
    const isOwner = currentUser && currentUser.email === OWNER_EMAIL;
    box.innerHTML += `
      <div class="p-card">
        <div class="p-top">
          <div>
            <div class="p-title">${p.name}</div>
            <span class="p-status ${p.status}">${p.status === 'available' ? 'متوفر' : 'غير متوفر'}</span>
          </div>
          <div class="opt-menu">
            <button class="opt-trigger" style="display:${isOwner ? 'block' : 'none'}" onclick="toggleDrop(${i})">
              <i class="ri-more-2-fill"></i>
            </button>
            <div class="opt-dropdown" id="drop-${i}">
              <button class="opt-item" onclick="openModal(${i})">تعديل الاسم</button>
              <button class="opt-item" style="color:#ff5f56" onclick="deleteProject(${i})">حذف</button>
            </div>
          </div>
        </div>
        <p class="p-desc">${p.desc}</p>
        <div class="p-actions">
          <span style="font-size:10px; color:var(--tm); font-family:'Share Tech Mono'">${p.date}</span>
          <a href="#" class="dl-btn" onclick="alert('يبدأ تحميل ملف: ${p.fileName}')">
            <i class="ri-download-cloud-2-line"></i> تنزيل (Download)
          </a>
        </div>
      </div>
    `;
  });
}

function toggleDrop(i) {
  document.getElementById(`drop-${i}`).classList.toggle('show');
}

// 6. نظام الثيمات (تغيير ألوان الأيقونات والنصوص تلقائياً)
function toggleSystemTheme() {
  const body = document.body;
  const trigger = document.getElementById('t-trigger');
  body.classList.toggle('light-theme');
  
  if (body.classList.contains('light-theme')) {
    trigger.innerHTML = '<i class="ri-moon-line"></i> الوضع الداكن';
  } else {
    trigger.innerHTML = '<i class="ri-sun-line"></i> الوضع الفاتح';
  }
}
</script>
</body>
</html>
