<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wano Studio | AI Portfolio & Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">

<style>
:root {
  --bg: #000000;
  --card: #0a0a0c;
  --border: rgba(255, 255, 255, 0.1);
  --tp: #ffffff;
  --tm: rgba(255, 255, 255, 0.6);
  --accent: #00f5ff;
  --term-bg: #050608;
}

body.light-theme {
  --bg: #ffffff;
  --card: #f5f7fa;
  --border: rgba(0, 0, 0, 0.1);
  --tp: #000000;
  --tm: rgba(0, 0, 0, 0.6);
  --accent: #0077ff;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--tp); transition: 0.3s; overflow-x: hidden; }

/* الخلفية النيون */
#neon-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

/* شريط التنقل */
#nav { position: fixed; top: 0; inset-inline: 0; height: 75px; background: rgba(var(--bg), 0.8); backdrop-filter: blur(15px); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; z-index: 1000; }
.nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--tp); font-weight: 900; font-size: 20px; }
.nav-logo img { width: 38px; height: 38px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); }

.nav-actions { display: flex; align-items: center; gap: 15px; }
.auth-btn { background: var(--tp); color: var(--bg); border: none; padding: 8px 20px; font-weight: 700; cursor: pointer; font-size: 13px; font-family: 'Cairo'; }
.user-pfp-nav { width: 35px; height: 35px; border-radius: 50%; border: 1px solid var(--accent); cursor: pointer; object-fit: cover; display: none; }

/* واجهة الهيرو والبنر */
#profile-header { position: relative; width: 100%; height: 320px; margin-top: 75px; z-index: 1; }
.profile-banner { width: 100%; height: 100%; background: #111; object-fit: cover; }
.profile-info-overlay { position: absolute; bottom: -50px; right: 40px; display: flex; align-items: flex-end; gap: 20px; }
.main-avatar { width: 130px; height: 130px; border-radius: 20px; border: 4px solid var(--bg); background: var(--card); object-fit: cover; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.name-box { margin-bottom: 15px; }
.user-name { font-size: 28px; font-weight: 900; line-height: 1; }
.user-bio { font-size: 14px; color: var(--tm); margin-top: 5px; }

/* التيرمنال */
#loader { position: fixed; inset: 0; background: #000; z-index: 99999; display: flex; align-items: center; justify-content: center; transition: 0.5s; }
.term-win { width: min(700px, 90vw); background: var(--term-bg); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.term-body { padding: 20px; height: 300px; font-family: 'Share Tech Mono'; font-size: 13px; color: #fff; overflow-y: auto; }

/* لوحة الإعدادات المحدثة */
#settings-panel { position: fixed; top: 0; left: -350px; width: 320px; height: 100vh; background: var(--card); border-right: 1px solid var(--border); z-index: 1010; padding: 30px; transition: 0.4s; overflow-y: auto; }
#settings-panel.open { left: 0; }
.close-settings { position: absolute; top: 20px; left: 20px; font-size: 24px; cursor: pointer; }
.setting-section { margin-top: 30px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
.setting-title { font-size: 16px; font-weight: 800; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

/* استايل رفع الصور */
.upload-label { display: block; width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px dashed var(--border); text-align: center; font-size: 12px; cursor: pointer; margin-bottom: 10px; }
.upload-label:hover { border-color: var(--accent); }
input[type="file"] { display: none; }

/* القوائم المنبثقة (Modals) */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 2000; }
.modal.active { display: flex; }
.modal-box { background: var(--card); border: 1px solid var(--border); width: min(400px, 90vw); padding: 30px; border-radius: 12px; }
.modal-tabs { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
.tab { padding-bottom: 10px; cursor: pointer; color: var(--tm); font-weight: 700; }
.tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
.form-input { width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: var(--tp); margin-bottom: 15px; font-family: 'Cairo'; }
</style>
</head>
<body class="dark-theme">

<canvas id="neon-canvas"></canvas>

<div id="loader">
  <div class="term-win">
    <div class="term-body" id="term-logs"></div>
  </div>
</div>

<nav id="nav">
  <a href="#" class="nav-logo">
    <img src="39001.jpg" alt="Logo" id="site-logo">
    <span>WANO STUDIO</span>
  </a>
  <div class="nav-actions">
    <button class="auth-btn" id="login-trigger" onclick="toggleModal('auth-modal')">تسجيل الدخول</button>
    <button class="auth-btn" id="add-proj-trigger" style="display:none; background:var(--accent); color:#000;" onclick="toggleModal('project-modal')">إضافة مشروع</button>
    <img src="39001.jpg" class="user-pfp-nav" id="nav-pfp" onclick="toggleSettings()">
  </div>
</nav>

<div id="profile-header">
  <img src="" class="profile-banner" id="user-banner-img">
  <div class="profile-info-overlay">
    <img src="39001.jpg" class="main-avatar" id="user-avatar-img">
    <div class="name-box">
      <h1 class="user-name" id="display-name">مروان وائل</h1>
      <p class="user-bio" id="display-bio">مطور برمجيات وأنظمة AI متطورة.</p>
    </div>
  </div>
</div>

<div id="settings-panel">
  <i class="ri-close-line close-settings" onclick="toggleSettings()"></i>
  <h2 style="font-size: 20px;">الإعدادات</h2>
  
  <div class="setting-section">
    <div class="setting-title"><i class="ri-user-settings-line"></i> تعديل البروفايل (Avatar)</div>
    
    <label class="upload-label">
      <i class="ri-image-add-line"></i> تغيير الصورة الشخصية
      <input type="file" id="input-avatar" accept="image/*" onchange="previewImage(this, 'user-avatar-img')">
    </label>
    
    <label class="upload-label">
      <i class="ri-layout-top-line"></i> تغيير البنر (Banner)
      <input type="file" id="input-banner" accept="image/*" onchange="previewImage(this, 'user-banner-img')">
    </label>

    <input type="text" class="form-input" id="input-name" placeholder="الاسم الجديد">
    <textarea class="form-input" id="input-bio" placeholder="البايو (وصف مختصر)"></textarea>
    <button class="auth-btn" style="width:100%" onclick="saveProfileChanges()">حفظ التعديلات</button>
  </div>

  <div class="setting-section">
    <div class="setting-title"><i class="ri-palette-line"></i> المظهر</div>
    <button class="theme-btn auth-btn" style="width:100%; background:transparent; border:1px solid var(--border); color:var(--tp)" onclick="toggleTheme()">تبديل الوضع (B/W)</button>
  </div>
  
  <button class="auth-btn" style="width:100%; margin-top:20px; background:#ff4444; color:#fff;" onclick="logout()">تسجيل الخروج</button>
</div>

<div class="modal" id="auth-modal">
  <div class="modal-box">
    <div class="modal-tabs">
      <div class="tab active" id="tab-login" onclick="switchAuth('login')">تسجيل دخول</div>
      <div class="tab" id="tab-signup" onclick="switchAuth('signup')">إنشاء حساب</div>
    </div>
    <div id="auth-form">
      <input type="email" id="auth-email" class="form-input" placeholder="الجيميل">
      <input type="password" id="auth-pass" class="form-input" placeholder="كلمة المرور">
      <button class="auth-btn" style="width:100%" id="auth-submit-btn" onclick="processAuth()">دخول</button>
    </div>
  </div>
</div>
<section id="projects-section" style="padding: 100px 30px; position: relative; z-index: 1;">
  <div class="sec-header" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px;">
    <div>
      <h2 style="font-size: 24px; font-weight: 800;"><i class="ri-stack-line" style="color:var(--accent)"></i> مشاريع المطور</h2>
      <p style="font-size: 13px; color: var(--tm);">أحدث الأدوات والبرمجيات المتاحة للتحميل المباشر.</p>
    </div>
  </div>

  <div class="proj-grid" id="projects-container">
    </div>
</section>

<div class="modal" id="project-modal">
  <div class="modal-box" style="width: min(500px, 95vw);">
    <h3 style="margin-bottom: 20px; font-size: 18px;" id="proj-modal-title">نشر مشروع جديد</h3>
    
    <div class="form-group">
      <label style="font-size: 12px; color: var(--tm); margin-bottom: 5px; display: block;">اسم المشروع</label>
      <input type="text" id="p-name" class="form-input" placeholder="Azkār Bot">
    </div>

    <div class="form-group">
      <label style="font-size: 12px; color: var(--tm); margin-bottom: 5px; display: block;">حالة المشروع</label>
      <select id="p-status" class="form-input">
        <option value="available">متوفر للتحميل</option>
        <option value="unavailable">قريباً / غير متوفر</option>
      </select>
    </div>

    <div class="form-group">
      <label style="font-size: 12px; color: var(--tm); margin-bottom: 5px; display: block;">وصف المشروع</label>
      <textarea id="p-desc" class="form-input" rows="3" placeholder="اشرح ميزات المشروع هنا..."></textarea>
    </div>

    <div class="form-group">
      <label class="upload-label" id="file-label">
        <i class="ri-file-upload-line"></i> ارفع ملف المشروع (Zip/Js/Html)
        <input type="file" id="p-file" onchange="updateFileName(this)">
      </label>
      <span id="file-name-display" style="font-size: 10px; color: var(--accent); display: block; margin-top: -10px; margin-bottom: 10px;"></span>
    </div>

    <div style="display: flex; gap: 10px; justify-content: flex-end;">
      <button class="auth-btn" style="background:transparent; border:1px solid var(--border); color:var(--tp);" onclick="toggleModal('project-modal')">إلغاء</button>
      <button class="auth-btn" style="background:var(--accent); color:#000;" onclick="saveProject()">نشر المشروع</button>
    </div>
  </div>
</div>

<style>
/* تنسيقات إضافية لبطاقة المشروع */
.p-card {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 25px;
  position: relative;
  transition: 0.3s;
  display: flex;
  flex-direction: column;
  gap: 15px;
}
.p-card:hover {
  border-color: var(--accent);
  transform: translateY(-5px);
}

.p-meta {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.p-tag {
  font-size: 10px;
  padding: 3px 8px;
  background: rgba(0,245,255,0.1);
  color: var(--accent);
  font-weight: 700;
}

/* قائمة الخيارات (الثلاث نقاط) */
.p-options {
  position: absolute;
  top: 15px;
  left: 15px; /* اتجاه اليسار في الموقع العربي */
}
.opt-btn {
  background: transparent;
  border: none;
  color: var(--tm);
  font-size: 20px;
  cursor: pointer;
  padding: 5px;
}
.opt-btn:hover { color: var(--tp); }

.opt-menu {
  position: absolute;
  top: 100%;
  left: 0;
  background: var(--card);
  border: 1px solid var(--border);
  width: 140px;
  z-index: 10;
  display: none;
  flex-direction: column;
}
.opt-menu.show { display: flex; }
.opt-item {
  padding: 10px 15px;
  font-size: 12px;
  background: transparent;
  border: none;
  color: var(--tp);
  text-align: right;
  cursor: pointer;
  font-family: 'Cairo';
}
.opt-item:hover { background: rgba(255,255,255,0.05); }

/* زر التحميل */
.p-download {
  width: 100%;
  padding: 12px;
  background: var(--tp);
  color: var(--bg);
  text-decoration: none;
  text-align: center;
  font-weight: 700;
  font-size: 13px;
  margin-top: auto;
  transition: 0.2s;
}
.p-download:hover { opacity: 0.9; }

/* شبكة المشاريع - ريسبونسيف */
.proj-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 25px;
}

/* قلب ألوان الأيقونات تلقائياً */
i {
  transition: color 0.3s ease;
}

/* تنسيقات شريط التمرير */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

@media(max-width: 600px) {
  .profile-info-overlay {
    right: 50%;
    transform: translateX(50%);
    flex-direction: column;
    align-items: center;
    bottom: -110px;
    text-align: center;
  }
  #profile-header { margin-bottom: 120px; }
}
</style>
<script>
// ─── إعدادات النظام الأساسية ───
const OWNER_EMAIL = "wanomrwan16@gmail.com";
const SYSTEM_KEY = "WANO_AI_CORE_2026"; // مفتاح تشفير وهمي للنظام
let currentUser = JSON.parse(localStorage.getItem('active_user')) || null;
let projects = JSON.parse(localStorage.getItem('wano_vault_projects')) || [];

// ─── محرك التشفير AI-Vault (التخزين الآمن) ───
const AIVault = {
    // تشفير البيانات (Base64 + Salt) لتبدو مشفرة برمجياً
    encrypt: (data) => btoa(SYSTEM_KEY + btoa(data)),
    decrypt: (data) => {
        try { return atob(atob(data).replace(SYSTEM_KEY, '')); } 
        catch(e) { return null; }
    },
    saveUser: (user) => {
        let users = JSON.parse(localStorage.getItem('registered_users')) || [];
        user.password = AIVault.encrypt(user.password); // تشفير كلمة السر
        users.push(user);
        localStorage.setItem('registered_users', JSON.stringify(users));
    }
};

// ─── محرك التيرمنال (الواقعي والبطيء) ───
const terminalLines = [
    { t: "Initializing AI-Auth Protocol...", c: "#00f5ff" },
    { t: "Loading encrypted vault: status: OK", c: "#00ff88" },
    { t: "Checking for admin: wanomrwan16@gmail.com", c: "#ffe600" },
    { t: "Syncing project database...", c: "#00f5ff" },
    { t: "Optimizing UI assets: [39001.jpg]", c: "#bf00ff" },
    { t: "System ready. Welcome back, Wano.", c: "#00ff88" }
];

async function startTerminal() {
    const box = document.getElementById('term-logs');
    for (let line of terminalLines) {
        let div = document.createElement('div');
        div.style.color = line.c;
        div.style.marginBottom = "5px";
        box.appendChild(div);
        // كتابة يدوية حرف بحرف
        for (let char of line.t) {
            div.innerHTML += char;
            await new Promise(r => setTimeout(r, 30));
        }
        await new Promise(r => setTimeout(r, 600));
        box.scrollTop = box.scrollHeight;
    }
    setTimeout(() => document.getElementById('loader').style.opacity = '0', 1000);
    setTimeout(() => document.getElementById('loader').remove(), 1600);
}

// ─── إدارة الجلسات والدخول (Auth) ───
let authMode = 'login';
function switchAuth(mode) {
    authMode = mode;
    document.getElementById('tab-login').classList.toggle('active', mode === 'login');
    document.getElementById('tab-signup').classList.toggle('active', mode === 'signup');
    document.getElementById('auth-submit-btn').innerText = mode === 'login' ? 'دخول' : 'إنشاء حساب';
}

function processAuth() {
    const email = document.getElementById('auth-email').value;
    const pass = document.getElementById('auth-pass').value;
    if (!email || !pass) return alert("أكمل البيانات!");

    if (authMode === 'signup') {
        AIVault.saveUser({ email, password: pass, name: 'مستخدم جديد', bio: 'لا يوجد بايو..', pfp: '39001.jpg', banner: '' });
        alert("تم إنشاء الحساب بنجاح! يمكنك الآن الدخول.");
        switchAuth('login');
    } else {
        let users = JSON.parse(localStorage.getItem('registered_users')) || [];
        let user = users.find(u => u.email === email && AIVault.decrypt(u.password) === pass);
        if (user) {
            currentUser = user;
            localStorage.setItem('active_user', JSON.stringify(user));
            location.reload(); // تحديث الموقع لتطبيق الصلاحيات
        } else {
            alert("بيانات الدخول غير صحيحة!");
        }
    }
}

// ─── إدارة الملفات والصور (FileReader API) ───
function previewImage(input, targetId) {
    const file = input.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            document.getElementById(targetId).src = e.target.result;
            // تخزين الصورة في ذاكرة الجلسة للتحديث
            if (targetId === 'user-avatar-img') currentUser.pfp = e.target.result;
            if (targetId === 'user-banner-img') currentUser.banner = e.target.result;
        };
        reader.readAsDataURL(file);
    }
}

function updateFileName(input) {
    document.getElementById('file-name-display').innerText = input.files[0] ? `ملف جاهز: ${input.files[0].name}` : '';
}

// ─── إدارة المشاريع ───
function saveProject() {
    const name = document.getElementById('p-name').value;
    const desc = document.getElementById('p-desc').value;
    const status = document.getElementById('p-status').value;
    const file = document.getElementById('p-file').files[0];

    if (!name || !desc) return alert("أدخل اسم ووصف المشروع!");

    const newProject = {
        id: Date.now(),
        name, desc, status,
        fileName: file ? file.name : "Code_Files.zip",
        date: new Date().toLocaleDateString('ar-EG')
    };

    projects.unshift(newProject);
    localStorage.setItem('wano_vault_projects', JSON.stringify(projects));
    renderProjects();
    toggleModal('project-modal');
}

function renderProjects() {
    const container = document.getElementById('projects-container');
    container.innerHTML = '';
    projects.forEach((p, index) => {
        const isOwner = currentUser && currentUser.email === OWNER_EMAIL;
        container.innerHTML += `
            <div class="p-card">
                <div class="p-meta">
                    <div>
                        <div class="p-title">${p.name}</div>
                        <span class="p-tag">${p.status === 'available' ? 'متوفر' : 'قريباً'}</span>
                    </div>
                    ${isOwner ? `
                    <div class="p-options">
                        <button class="opt-btn" onclick="document.getElementById('opt-${index}').classList.toggle('show')"><i class="ri-more-2-line"></i></button>
                        <div class="opt-menu" id="opt-${index}">
                            <button class="opt-item" onclick="deleteProject(${index})">حذف المشروع</button>
                        </div>
                    </div>` : ''}
                </div>
                <p class="p-desc">${p.desc}</p>
                <div style="font-size:10px; color:var(--tm); margin-top:10px;">بتاريخ: ${p.date}</div>
                <a href="#" class="p-download" onclick="alert('يبدأ تحميل: ${p.fileName}')"><i class="ri-download-line"></i> تنزيل (Download)</a>
            </div>
        `;
    });
}

function deleteProject(idx) {
    projects.splice(idx, 1);
    localStorage.setItem('wano_vault_projects', JSON.stringify(projects));
    renderProjects();
}

// ─── تحديث البروفايل ───
function saveProfileChanges() {
    currentUser.name = document.getElementById('input-name').value || currentUser.name;
    currentUser.bio = document.getElementById('input-bio').value || currentUser.bio;
    localStorage.setItem('active_user', JSON.stringify(currentUser));
    
    // تحديث كل المستخدمين المسجلين في الـ Storage
    let users = JSON.parse(localStorage.getItem('registered_users'));
    let idx = users.findIndex(u => u.email === currentUser.email);
    users[idx] = currentUser;
    localStorage.setItem('registered_users', JSON.stringify(users));
    
    location.reload();
}

// ─── وظائف الـ UI ───
function toggleModal(id) { document.getElementById(id).classList.toggle('active'); }
function toggleSettings() { document.getElementById('settings-panel').classList.toggle('open'); }
function logout() { localStorage.removeItem('active_user'); location.reload(); }

function toggleTheme() {
    document.body.classList.toggle('light-theme');
}

// ─── التشغيل عند التحميل ───
window.onload = () => {
    startTerminal();
    renderProjects();
    
    if (currentUser) {
        document.getElementById('login-trigger').style.display = 'none';
        document.getElementById('nav-pfp').style.display = 'block';
        document.getElementById('nav-pfp').src = currentUser.pfp || '39001.jpg';
        document.getElementById('user-avatar-img').src = currentUser.pfp || '39001.jpg';
        document.getElementById('user-banner-img').src = currentUser.banner || '';
        document.getElementById('display-name').innerText = currentUser.name;
        document.getElementById('display-bio').innerText = currentUser.bio;
        
        if (currentUser.email === OWNER_EMAIL) {
            document.getElementById('add-proj-trigger').style.display = 'block';
        }
    }
};
</script>
